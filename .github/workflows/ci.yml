name: CI
# Build libseams from seams-core at a pinned ref, install it, then build
# and test this package with fpm and meson the way a user would. fpm
# publish only prints its upload data. The docs job builds the manual
# without libseams, and a push to main deploys it to GitHub Pages.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # seams-core v2.14.1. The ref is the annotated tag, not a branch.
  # The tag points at 0f6c82810f5c1e61a70c363cca50fe8148b3ff21.
  SEAMS_CORE_REPOSITORY: d-SEAMS/seams-core
  SEAMS_CORE_REF: v2.14.1
  SEAMS_PREFIX: ${{ github.workspace }}/../seams-prefix

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gfortran, flang-new-19]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SEAMS_CORE_REPOSITORY }}
          ref: ${{ env.SEAMS_CORE_REF }}
          path: _seams-core
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ gfortran flang-19 ninja-build pkg-config libeigen3-dev libgomp1
          # 24.04 has no libflexiblas-dev; the seams-core script builds it.
          sudo sh _seams-core/scripts/install_flexiblas.sh
          pipx install meson
          pipx install fpm
      - name: Build and install libseams
        working-directory: _seams-core
        run: |
          meson setup build-pkg --buildtype=release --prefix="$SEAMS_PREFIX" --libdir=lib \
            -Dwith_tests=false -Dwith_chemfiles=disabled -Dwith_lammps=disabled -Dwith_gromacs=disabled \
            -Dwith_openmm=disabled -Dwith_plumed=disabled -Dwith_gpulite=disabled
          ninja -C build-pkg
          meson install -C build-pkg
      - name: Point the builds at libseams
        run: |
          # libseams.so has no RUNPATH to the libraries installed beside it.
          {
            echo "LD_LIBRARY_PATH=$SEAMS_PREFIX/lib"
            echo "PKG_CONFIG_PATH=$SEAMS_PREFIX/lib/pkgconfig"
            echo "FPM_LDFLAGS=-L$SEAMS_PREFIX/lib -Wl,-rpath,$SEAMS_PREFIX/lib"
            echo "OMP_NUM_THREADS=1"
          } >> "$GITHUB_ENV"
      - name: fpm test
        run: fpm test --compiler "${{ matrix.compiler }}"
      - name: fpm examples
        run: |
          fpm run --compiler "${{ matrix.compiler }}" --example cubic
          fpm run --compiler "${{ matrix.compiler }}" --example minimal -- input/traj/genice_sI.lammpstrj
      - name: Downstream project with a path dependency
        working-directory: examples/downstream
        run: fpm run --compiler "${{ matrix.compiler }}"
      - name: Meson
        run: |
          FC="${{ matrix.compiler }}" meson setup build/meson -Dseams_libdir="$SEAMS_PREFIX/lib"
          meson test -C build/meson --print-errorlogs
      # fpm publish archives fpm_model.json before writing it (fpm 0.12,
      # 0.13), so dump the model first. --show-upload-data does not upload.
      - name: Registry upload data
        if: matrix.compiler == 'gfortran'
        run: |
          fpm build --compiler gfortran --dump fpm_model.json
          fpm publish --show-upload-data

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          pipx install ford==7.0.13
          pipx install sphinx
          pipx inject sphinx shibuya myst-parser
      # ford.md writes the API reference. The coverage check fails when a
      # public symbol has no page. Sphinx builds the manual around it.
      - name: Documentation
        run: |
          ford ford.md
          python3 docs/check_api_coverage.py build/ford
          sphinx-build -W -b html docs build/html
          python3 docs/assemble_site.py build/html build/ford
          python3 docs/check_site.py build/html
          python3 docs/seo.py --check build/html
      # The site's own URL is skipped: build/html is that site, checked
      # here before it is deployed. _static holds unrendered theme macros.
      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --max-concurrency 4
            --accept 200,206,429
            --extensions md,html
            --exclude '^https://fortran\.dseams\.info/'
            --exclude-path 'build/html/_static'
            README.md build/html
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/html

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docs]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The published site, as readers get it: every page of the deployed
  # artifact is a lychee input at its live address, so relative links
  # resolve against the page they are on. A live 404 fails the run.
  # _static holds theme templates, not pages.
  live-links:
    needs: pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: artifact
      - name: Page list
        run: |
          mkdir site && tar -xf artifact/artifact.tar -C site
          (cd site && find . -name '*.html' -not -name 404.html -not -path './_static/*' \
            | sed 's#^\./#https://fortran.dseams.info/#') > pages.txt
          wc -l pages.txt
      - name: Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --max-concurrency 8
            --accept 200,202,206,429
            --remap "https://github.com/d-SEAMS/dseams-fortran/(blob|tree)/main file://${{ github.workspace }}"
            --exclude '^https://doi\.org/'
            --files-from pages.txt
          token: ${{ secrets.GITHUB_TOKEN }}
