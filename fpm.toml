name = "dseams"
version = "2.14.0"
license = "MIT"
author = "Rohit Goswami"
maintainer = "rgoswami@ieee.org"
copyright = "Copyright 2018--present, d-SEAMS core team"
description = "Fortran interface to the d-SEAMS C API (ice, clathrate and ring analysis)"
homepage = "https://dseams.info"
categories = ["scientific"]
keywords = ["molecular-dynamics", "ice", "clathrate", "chemistry"]

# The modules bind include/seams.h from seams-core tag v2.14.0
# (d-SEAMS/seams-core) through iso_c_binding and link an installed
# libseams of that version (meson install, conda, Nix or Spack).
# Point fpm at it:
#   export FPM_LDFLAGS="$(pkg-config --libs-only-L seams) -Wl,-rpath,$(pkg-config --variable=libdir seams)"
[build]
auto-executables = false
auto-tests = false
auto-examples = false
link = ["seams"]
module-naming = "seams"

[library]
source-dir = "src"

[[test]]
name = "check_dseams"
source-dir = "test"
main = "check_dseams.f90"

[[test]]
name = "capi"
source-dir = "test"
main = "test_capi.f90"

[[test]]
name = "high"
source-dir = "test"
main = "test_high.f90"

# The language-front task program. It binds libseams_lang directly.
[[test]]
name = "lang_tasks"
source-dir = "test"
main = "lang_tasks.f90"
link = ["seams_lang"]

[[example]]
name = "cubic"
source-dir = "example"
main = "cubic.f90"

[[example]]
name = "minimal"
source-dir = "example"
main = "minimal.f90"

[install]
library = true
