name = "dseams"
version = "2.14.1"
license = "MIT"
author = "Rohit Goswami"
maintainer = "rgoswami@ieee.org"
copyright = "Copyright 2018--present, d-SEAMS core team"
description = "Fortran interface to the d-SEAMS C API. Analyses: CHILL, CHILL+, Steinhardt q4/q6, ql and q6-bar, cutoff, mutual and k-nearest neighbours, primitive rings, hexagonal and double-diamond cages, signature cages, RDF, running coordination number, coordination, hydrogen bonds, axial density, topological fingerprint, contact pairs, domains, prisms, monolayer, site kinds, ice symmetry and brine fronts. Readers: LAMMPS dump and XYZ always; EON CON when the linked libseams includes readcon-core; PDB, GRO and the other chemfiles trajectories when it includes chemfiles. has_chemfiles and has_readcon report the loaded engine."
homepage = "https://dseams.info"
categories = ["scientific"]
keywords = ["molecular-dynamics", "ice", "clathrate", "chemistry"]

# The modules bind include/seams.h from seams-core tag v2.14.1
# (d-SEAMS/seams-core) through iso_c_binding and link an installed
# libseams of that version (meson install, conda, Nix or Spack).
# Point fpm at it:
#   export FPM_LDFLAGS="$(pkg-config --libs-only-L seams) -Wl,-rpath,$(pkg-config --variable=libdir seams)"
[build]
auto-executables = false
auto-tests = false
auto-examples = false
link = ["seams"]
module-naming = "seams"

[library]
source-dir = "src"

[[test]]
name = "check_dseams"
source-dir = "test"
main = "check_dseams.f90"

[[test]]
name = "capi"
source-dir = "test"
main = "test_capi.f90"

[[test]]
name = "high"
source-dir = "test"
main = "test_high.f90"

# The language-front task program. It binds libseams_lang directly.
[[test]]
name = "lang_tasks"
source-dir = "test"
main = "lang_tasks.f90"
link = ["seams_lang"]

# CON, PDB and GRO. Each read runs only when has_readcon or has_chemfiles
# says the loaded libseams can do it. DSEAMS_REQUIRE_READERS=1 makes a
# false answer a failure, for a job that built those readers in.
[[test]]
name = "readers"
source-dir = "test"
main = "test_readers.f90"

# A standalone consumer of has_chemfiles, has_readcon and probe_directory,
# which add no C ABI: this fails to compile against a seams.mod built
# before they existed.
[[test]]
name = "feature_query"
source-dir = "test"
main = "test_feature_query.f90"

# Real POSIX threads calling has_chemfiles and has_readcon at once.
# The library itself links no pthread symbol any more (the once-guard
# is the C11 stdatomic.h shim in src/dseams_once.c); only this test,
# which spawns real pthreads to exercise it, needs pthread_create and
# pthread_join.
[[test]]
name = "thread_safety"
source-dir = "test"
main = "test_thread_safety.f90"
link = ["pthread"]

# A symlink planted at the once-guard's old lock-file name must not be
# followed or truncated: see the comment at the top of the test.
[[test]]
name = "no_lock_symlink"
source-dir = "test"
main = "test_no_lock_symlink.f90"

[[example]]
name = "cubic"
source-dir = "example"
main = "cubic.f90"

[[example]]
name = "minimal"
source-dir = "example"
main = "minimal.f90"

[install]
library = true
